name: Agent Inbox Smoke Test

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Read-only source or reporting-health scenario'
        required: true
        type: choice
        default: live
        options:
          - live
          - sample
          - stale-source
          - failed-source

# This workflow is deliberately manual-only and read-only. Unspecified token
# permissions are set to none.
permissions:
  actions: read
  pull-requests: read

jobs:
  smoke-test:
    name: Generate read-only inbox smoke report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query sources and report health
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SCENARIO: ${{ inputs.scenario }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          summary() {
            printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
          }

          summary '## Agent Inbox Smoke Test'
          summary ''
          summary "- Repository: \`$GH_REPO\`"
          summary "- Scenario: \`$SCENARIO\`"
          summary "- Report generated (UTC): \`$(date -u '+%Y-%m-%d %H:%M:%S')\`"
          summary '- Mode: read-only; no GitHub objects were changed.'
          summary ''

          case "$SCENARIO" in
            live)
              if ! pull_requests="$(gh pr list --repo "$GH_REPO" --state open --limit 100 --json number,isDraft,updatedAt,url,reviewDecision 2>/dev/null)"; then
                summary '**Source status: FAILED** — pull request query was inaccessible or failed; this is not an empty queue.'
                exit 1
              fi

              if ! workflow_runs="$(gh run list --repo "$GH_REPO" --all --limit 100 --json databaseId,status,conclusion,createdAt,updatedAt 2>/dev/null)"; then
                summary '**Source status: FAILED** — workflow run query was inaccessible or failed; this is not an empty queue.'
                exit 1
              fi

              open_pr_count="$(jq 'length' <<< "$pull_requests")"
              draft_pr_count="$(jq '[.[] | select(.isDraft == true)] | length' <<< "$pull_requests")"
              run_count="$(jq 'length' <<< "$workflow_runs")"
              failed_runs="$(jq --arg run_id "$CURRENT_RUN_ID" '[.[] | select((.databaseId | tostring) != $run_id) | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "action_required")]' <<< "$workflow_runs")"
              failed_run_count="$(jq 'length' <<< "$failed_runs")"

              summary '**Source status: FRESH** — both read-only GitHub queries succeeded.'
              summary ''
              summary '| Type | Object | State | Last update | Reason | Source / suggested next action |'
              summary '|---|---|---|---|---|---|'

              while IFS=$'\t' read -r number is_draft review_decision updated_at; do
                [[ -n "$number" ]] || continue
                if [[ "$is_draft" == "true" ]]; then
                  state='Draft'
                  reason='Not yet marked ready for review'
                  next_action='Review the draft and decide when it is ready'
                else
                  case "$review_decision" in
                    REVIEW_REQUIRED)
                      state='Review required'
                      reason='No approving review is recorded'
                      next_action='Request or complete human review'
                      ;;
                    CHANGES_REQUESTED)
                      state='Changes requested'
                      reason='A review requests changes'
                      next_action='Inspect feedback; a human decides the next action'
                      ;;
                    APPROVED)
                      state='Review approved'
                      reason='Review is approved; CI/merge state still matters'
                      next_action='Check required CI and leave merge to a human'
                      ;;
                    *)
                      state='Review state unknown'
                      reason='GitHub did not return a review decision'
                      next_action='Inspect the source PR'
                      ;;
                  esac
                fi
                summary "| Pull request | #$number | $state | $updated_at | $reason | [Open source PR](https://github.com/$GH_REPO/pull/$number); $next_action |"
              done < <(jq -r '.[] | [.number, (.isDraft|tostring), (.reviewDecision // "UNKNOWN"), .updatedAt] | @tsv' <<< "$pull_requests")

              while IFS=$'\t' read -r run_id conclusion updated_at; do
                [[ -n "$run_id" ]] || continue
                summary "| CI workflow | Run #$run_id | $conclusion | $updated_at | Workflow run needs inspection | [Open source run](https://github.com/$GH_REPO/actions/runs/$run_id); inspect logs; no repair is launched |"
              done < <(jq -r '.[] | [.databaseId, .conclusion, .updatedAt] | @tsv' <<< "$failed_runs")

              if [[ "$open_pr_count" -eq 0 ]]; then
                summary '| Pull request | — | None | — | No open pull requests found | Source query succeeded |'
              fi
              if [[ "$failed_run_count" -eq 0 ]]; then
                summary '| CI workflow | — | None | — | No failed workflow runs found in the returned window | Source query succeeded |'
              fi
              summary ''
              summary "- Draft PRs in open queue: $draft_pr_count"
              summary "- Workflow runs queried (latest 100): $run_count"
              summary '- Board approvals, blocked claims, agent questions, and repair-iteration limits: **NOT QUERIED** (test repo has no board configuration); this is not an empty result.'

              if [[ "$open_pr_count" -ge 100 || "$run_count" -ge 100 ]]; then
                summary ''
                summary '**Queue state: PARTIAL** — at least one source reached the 100-item query limit; do not treat this report as a complete queue.'
              elif [[ "$open_pr_count" -eq 0 && "$failed_run_count" -eq 0 ]]; then
                summary ''
                summary '**Queue state: EMPTY** — sources were reachable and returned no actionable PR or failed-run items.'
              else
                summary ''
                summary '**Queue state: ITEMS FOUND** — inspect the source repository for human decisions.'
              fi
              ;;

            sample)
              summary '**Source status: SIMULATED FIXTURE** — the following items are synthetic, not GitHub data.'
              summary ''
              summary '| Type | Object | State | Age/last update | Reason for attention | Source / suggested next action |'
              summary '|---|---|---|---|---|---|'
              summary '| Pull request | Fixture PR #123 | Review required | Updated 2 hours ago (fixture) | No approving review | Fixture only; inspect the source PR in a real run |'
              summary '| CI workflow | Fixture run #456 | Failed | Updated 15 minutes ago (fixture) | A check failed | Fixture only; inspect logs; no repair is launched |'
              summary '| Board item | Fixture issue #789 | Blocked | Updated 1 day ago (fixture) | A dependency is unresolved | Fixture only; review blockers in the board |'
              summary '| Agent question | Fixture issue #790 | Needs human decision | Updated 30 minutes ago (fixture) | Agent is waiting for clarification | Fixture only; answer in the source issue |'
              summary '| Repair limit | Fixture PR #791 | Exhausted | Updated 3 hours ago (fixture) | Iteration limit reached | Fixture only; inspect the PR and decide whether to resume |'
              ;;

            stale-source)
              last_success="$(date -u -d '2 hours ago' '+%Y-%m-%d %H:%M:%S UTC')"
              summary '**Source status: STALE (SIMULATED FIXTURE)** — last successful refresh was more than the 60-minute test threshold ago.'
              summary "- Simulated last success: \`$last_success\`"
              summary '- The report does not present this source as an empty queue.'
              ;;

            failed-source)
              summary '**Source status: FAILED (SIMULATED FIXTURE)** — the source error is visible and must not be interpreted as an empty queue.'
              summary ''
              summary 'This scenario intentionally exits nonzero so the failed-source path is visible in Actions.'
              exit 1
              ;;

            *)
              summary '**Source status: FAILED** — unsupported scenario.'
              exit 2
              ;;
          esac
